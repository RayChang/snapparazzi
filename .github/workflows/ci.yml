name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcrun --show-sdk-version
          xcrun swiftc --version

      - name: Verify shell syntax
        run: |
          /bin/sh -n install.sh
          /bin/zsh -n tests/run-tests.sh
          /bin/zsh -n tests/record-cli-tests.sh
          /bin/zsh -n tests/install-tests.sh
          /bin/zsh -n tests/recording-acceptance.sh
          /bin/zsh -n tests/recording-long-run.sh
          /bin/zsh -n tests/recording-microphone.sh
          /bin/sh -n tests/fixtures/curl

      - name: Build and test
        run: make test


  # macOS 14 runner images are retired on 2026-11-02 (the job was verified on macOS
  # 14.8.9 on 2026-10-30, see docs). Users on macOS 14 build with Xcode 16, whose
  # compiler once rejected code Swift 6.3 accepted, so build and test with the
  # newest Xcode 16 here, and also compile for a macOS 14 deployment target so every
  # macOS 15 API stays behind #available.
  xcode16:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select the newest Xcode 16
        run: |
          xcode="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$xcode" ] || { echo "no Xcode 16 on this runner"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$xcode"
          sw_vers
          xcrun --show-sdk-version
          xcrun swiftc --version

      - name: Build and test with Xcode 16
        run: make test

      - name: Compile for a macOS 14 deployment target
        run: |
          xcrun swiftc -emit-executable -O -whole-module-optimization -warnings-as-errors \
            -target "$(uname -m)-apple-macosx14.0" \
            $(find Sources/Snapparazzi -name '*.swift' | LC_ALL=C sort) .build/Generated/BuildMetadata.swift \
            -o "$RUNNER_TEMP/snapparazzi-macos14"
          otool -l "$RUNNER_TEMP/snapparazzi-macos14" | grep -A4 LC_BUILD_VERSION | grep -E 'minos|sdk'
