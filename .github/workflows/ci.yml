name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcrun --show-sdk-version
          xcrun swiftc --version

      - name: Verify shell syntax
        run: |
          /bin/sh -n install.sh
          /bin/zsh -n tests/run-tests.sh
          /bin/zsh -n tests/record-cli-tests.sh
          /bin/zsh -n tests/install-tests.sh
          /bin/zsh -n tests/recording-acceptance.sh
          /bin/zsh -n tests/recording-long-run.sh
          /bin/zsh -n tests/recording-microphone.sh
          /bin/sh -n tests/fixtures/curl

      - name: Build and test
        run: make test
